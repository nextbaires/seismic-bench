name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # setup-uv with python-version already created .venv and exported
      # VIRTUAL_ENV, so `uv venv` here would fail on the existing directory and
      # `uv pip install --system` would hit PEP 668 on the runner's managed
      # interpreter. Install into that venv and call its binaries directly —
      # same thing that runs locally, no resolution ambiguity.
      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      # Everything below runs against the committed sample catalog. No network,
      # no credentials — if CI needs the internet to verify a benchmark, the
      # benchmark is not reproducible.
      - name: Test
        run: .venv/bin/pytest -q

      - name: Run baselines end to end
        run: |
          .venv/bin/python -m seismic_bench.bench.run --model poisson
          .venv/bin/python -m seismic_bench.bench.run --model etas

      - name: Rebuild leaderboard
        run: .venv/bin/python -m seismic_bench.leaderboard

      - name: Fail if the leaderboard drifted
        # The committed results.json must match what the code produces from the
        # committed sample. A pull request that changes scores has to say so in
        # the diff rather than leaving the published numbers stale.
        run: |
          if ! git diff --quiet -- leaderboard/results.json; then
            echo "::error::leaderboard/results.json is out of date."
            echo "Run: python -m seismic_bench.leaderboard  — and commit the result."
            git diff -- leaderboard/results.json
            exit 1
          fi
