# Turns a domain proposal into a reviewed pull request.
#
# The label gate is the security boundary: anyone can file an issue, only a
# maintainer can label one. Do not change this to `issues: [opened]` — that
# would let any account on the internet start a billed agent run against this
# repository.
#
# See https://github.com/nextbaires/expert-loop

name: Expert loop

on:
  issues:
    types: [labeled]

# Required. This repository's default GITHUB_TOKEN is read-only, and a called
# workflow cannot request more than its caller was granted — without this block
# the run dies at startup, before the label gate is even evaluated, with no job
# and no log to read. Granted here rather than by loosening the repository-wide
# default, so every other workflow stays read-only.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft:
    if: >
      github.event.label.name == 'approved-for-drafting' &&
      contains(github.event.issue.labels.*.name, 'proposal')
    uses: nextbaires/expert-loop/.github/workflows/expert-loop.yml@v1
    with:
      domain: seismology
      allowed-paths: "seismic_bench/ tests/ docs/"
      test-command: "pytest -q"
      model: claude-opus-5
      max-turns: 40
      # A cheap Haiku pass decides whether the proposal is actionable before the
      # expensive drafting run reads the whole codebase.
      triage: true
    secrets:
      # Subscription-backed, so drafting adds no per-token bill. Generate with
      # `claude setup-token`. Swap for anthropic-api-key to pay per token instead.
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
