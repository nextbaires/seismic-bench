[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seismic-bench"
version = "0.1.0"
description = "An open, reproducible benchmark for earthquake forecasting."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Franco Gottig" }]
keywords = ["seismology", "earthquake", "forecasting", "benchmark", "csep"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/nextbaires/seismic-bench"
Issues = "https://github.com/nextbaires/seismic-bench/issues"

[tool.hatch.build.targets.wheel]
packages = ["seismic_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
